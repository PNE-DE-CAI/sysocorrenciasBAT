function updateNotifs(){const n=state.ocorrencias.filter(o=>o.status==='aberta').length;$('#notifCount').textContent=n}
function realtime(){[STORES.alunos,STORES.turmas,STORES.professores,STORES.ocorrencias].forEach(col=>db.collection(col).onSnapshot(s=>{state[col]=s.docs.map(d=>({id:d.id,...d.data()}));nav(state.section);updateNotifs()},e=>{console.error(e);setStatus('offline')}));db.collection(STORES.school).doc('main').onSnapshot(d=>{if(d.exists)state.school={id:d.id,...d.data()}});db.collection(STORES.config).doc('disciplinas').onSnapshot(d=>{if(d.exists)state.disciplinas=d.data().lista||DISC.slice()})}
function initFiles(){const parse=async(file)=>{if(file.name.toLowerCase().endsWith('.csv')){const txt=await file.text(),sep=(txt.split(/\r?\n/)[0].includes(';')?';':','),lines=txt.replace(/^\ufeff/,'').split(/\r?\n/).filter(Boolean),h=lines.shift().split(sep).map(x=>x.replace(/^"|"$/g,'').trim());return lines.map(l=>{const v=l.split(sep).map(x=>x.replace(/^"|"$/g,'').trim()),o={};h.forEach((k,i)=>o[k]=v[i]||'');return o})}const b=await file.arrayBuffer(),wb=XLSX.read(b,{type:'array'});return XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]])};$('#fileAlunos').onchange=async e=>{for(const r of await parse(e.target.files[0])){const nome=String(r.Nome||r.nome||'').trim();if(nome)await put(STORES.alunos,{id:uid(),ra:String(r.RA||r.ra||''),nome,turma:r.Turma||r.turma||'',nascimento:r['Data de Nascimento']||'',respNome:r['Responsável Legal']||r.Responsavel||'',respTel:r['Tel. do Responsável']||'',endereco:r['Endereço']||'',observacoes:r['Observações']||''})}e.target.value='';toast('Alunos importados.','success')};$('#fileTurmas').onchange=async e=>{for(const r of await parse(e.target.files[0])){const nome=String(r.Turma||r.Nome||'').trim();if(nome)await put(STORES.turmas,{id:uid(),nome,ano:r['Ano/Série']||'',periodo:r['Período']||r.Periodo||'',sala:r.Sala||''})}e.target.value=''};$('#fileProfs').onchange=async e=>{for(const r of await parse(e.target.files[0])){const nome=String(r.Nome||'').trim();if(nome)await put(STORES.professores,{id:uid(),nome,disciplina:r.Disciplina||'',telefone:r.Telefone||'',email:r['E-mail']||'',turmas:r['Turmas Atribuídas']||''})}e.target.value=''};$('#fileBackup').onchange=async e=>{try{const d=JSON.parse(await e.target.files[0].text());for(const k of ['alunos','turmas','professores','ocorrencias'])for(const x of d[k]||[])await put(STORES[k],x);if(d.school)await put(STORES.school,{id:'main',...d.school});if(d.disciplinas)await put(STORES.config,{id:'disciplinas',lista:d.disciplinas});toast('Backup importado.','success')}catch{toast('Backup inválido.','error')}e.target.value=''}}
window.App={close,editAluno:formAluno,editTurma:formTurma,editProf:formProf,editOcorr:formOcorr,delAluno:id=>remove('Aluno',id),delTurma:id=>remove('Turma',id),delProf:id=>remove('Prof',id),delOcorr:id=>remove('Ocorr',id),viewOcorr,printOcorr,rmDisc:async i=>{state.disciplinas.splice(i,1);await put(STORES.config,{id:'disciplinas',lista:state.disciplinas});renderDisc()},pront:id=>{nav('prontuario');$('#prontSel').value=id;renderPront()}};
async function init(){try{$('#loadingText').textContent='Carregando dados...';document.body.classList.toggle('dark',loadLS('cgp_dark',false));build();initFiles();await loadAll();$('#userBtn').textContent='👤 '+state.user.nome;$('#theme').textContent=document.body.classList.contains('dark')?'☀️ Tema Claro':'🌙 Tema Escuro';$('#theme').onclick=()=>{document.body.classList.toggle('dark');saveLS('cgp_dark',document.body.classList.contains('dark'));$('#theme').textContent=document.body.classList.contains('dark')?'☀️ Tema Claro':'🌙 Tema Escuro';if(state.section==='dashboard')renderDash()};$('#sync').onclick=async()=>{await loadAll();nav(state.section)};$('#menuBtn').onclick=()=>$('#sidebar').classList.toggle('open');$('#modalClose').onclick=close;$('#modal').onclick=e=>{if(e.target===$('#modal'))close()};$('#userBtn').onclick=()=>{nav('config');$('#cfgNome').focus()};$('#notifBtn').onclick=()=>{nav('ocorrencias');$('#fos').value='aberta';renderOcorr()};$('#globalSearch').onkeydown=e=>{if(e.key==='Enter'){nav('alunos');$('#fa').value=e.target.value;renderAlunos()}};nav('dashboard');realtime()}finally{$('#loading').classList.add('hidden');$('#app').classList.remove('hidden')}}init();
})();
</script>
